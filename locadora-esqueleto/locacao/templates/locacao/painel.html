{% extends "locacao/base.html" %}
{% block conteudo %}
<h1 class="h3 mb -4">Painel do dia</h1>
<div class="row g-3">

    <div class="card border-{{ cor }} h-100"><div class="card-body">
      <div class="text-muted small">{{ titulo }}</div>
      <div class="display-6">{{ valor }}</div>
    </div></div>
  </div>
  {% endfor %}
</div>
{% endblock %}
